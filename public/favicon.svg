<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#0B0C0E" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#22262E" stroke-width="2" />
  <!-- Mirror center axis -->
  <line x1="32" y1="12" x2="32" y2="52" stroke="#FACC15" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2 3" />
  <!-- Left soundwave -->
  <rect x="13" y="25" width="4" height="14" rx="2" fill="#FACC15" fill-opacity="0.55" />
  <rect x="20" y="18" width="4" height="28" rx="2" fill="#FACC15" fill-opacity="0.85" />
  <rect x="27" y="14" width="4" height="36" rx="2" fill="#FACC15" />
  <!-- Reflected mirror wave -->
  <rect x="33" y="14" width="4" height="36" rx="2" fill="#FACC15" fill-opacity="0.65" />
  <rect x="40" y="18" width="4" height="28" rx="2" fill="#FACC15" fill-opacity="0.4" />
  <rect x="47" y="25" width="4" height="14" rx="2" fill="#FACC15" fill-opacity="0.22" />
</svg>
